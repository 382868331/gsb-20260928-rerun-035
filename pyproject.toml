[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-upgrade"
version = "0.1.0"
description = "边缘设备升级系统（第一版，虚拟设备本地验证）"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["edge_upgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
